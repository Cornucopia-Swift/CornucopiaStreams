name: Swift

on: [push]

jobs:
  linux:
    name: Swift ${{ matrix.swift }} on Linux
    strategy:
      matrix:
        swift: ["6.2"]
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Run tests
        run: swift test

  macos:
    name: Swift (Xcode) on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Run tests
        run: swift test
